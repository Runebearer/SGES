name: Deploy Worker

# Déploie le Worker Cloudflare (apps/worker) à chaque push sur `main` touchant
# le Worker ou les packages partagés. Le site Next.js, lui, est déployé par
# l'intégration git de Vercel (indépendante de ce workflow).
on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - '.github/workflows/deploy-worker.yml'
  # Permet aussi de déclencher manuellement depuis l'onglet Actions.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Monorepo npm workspaces : l'install à la racine crée les liens vers
      # @sges/api-contract dont le Worker dépend.
      - run: npm ci

      # Filet de sécurité : on ne déploie pas un Worker qui ne compile pas.
      - name: Typecheck worker
        run: npm run typecheck -w @sges/worker

      - name: Deploy worker
        run: npm run deploy -w @sges/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
